services:
  # PostgreSQL Database
  - type: pserv
    name: blog-generator-db
    env: docker
    plan: free
    disk:
      name: postgres
      mountPath: /var/lib/postgresql/data
      sizeGB: 10

  # Backend Flask API service
  - type: web
    name: blog-generator-api
    env: python
    buildCommand: pip install -r requirements.txt && flask db upgrade
    startCommand: gunicorn 'wsgi:app' --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: API_KEY_SALT
        generateValue: true
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: blog-generator-db
          property: connectionString

  # Frontend Streamlit service
  - type: web
    name: blog-generator-frontend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: API_URL
        fromService:
          name: blog-generator-api
          type: web
          property: url
        postfix: /api 